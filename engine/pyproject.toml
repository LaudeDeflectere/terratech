[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dgm-engine"
version = "1.0.0"
description = "KAGIS DGM GeoTIFF to AutoCAD R12 DXF conversion engine"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "rasterio>=1.3",
  "contourpy>=1.2",
  "shapely>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "ezdxf>=1.3"]

[tool.setuptools]
packages = ["dgm_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
